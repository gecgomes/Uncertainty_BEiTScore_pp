name: tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
          pip install -e ".[dev]"
      - name: Static check (pyflakes rules, honouring noqa)
        run: ruff check --select F beitscore scripts tests
      - name: Tests
        run: python -m pytest -rxX
